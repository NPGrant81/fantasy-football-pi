name: Deployment Secrets Precheck

on:
  schedule:
    # Daily at 05:15 UTC, ahead of most maintenance windows.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck-production:
    name: Precheck Production Secrets
    runs-on: ubuntu-latest
    environment: production
    outputs:
      state: ${{ steps.validate.outputs.state }}
      missing_csv: ${{ steps.validate.outputs.missing_csv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production secrets
        id: validate
        env:
          PRODUCTION_DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED || 'true' }}
          PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          PROD_DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_DEPLOY_APP_DIR: ${{ secrets.PROD_DEPLOY_APP_DIR }}
          PROD_DEPLOY_KNOWN_HOST: ${{ secrets.PROD_DEPLOY_KNOWN_HOST }}
        run: python -m scripts.validate_workflow_integration production_deploy

  precheck-staging:
    name: Precheck Staging Secrets
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      state: ${{ steps.validate.outputs.state }}
      missing_csv: ${{ steps.validate.outputs.missing_csv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate staging secrets
        id: validate
        env:
          STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED || 'false' }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          STAGING_DEPLOY_KNOWN_HOST: ${{ secrets.STAGING_DEPLOY_KNOWN_HOST }}
        run: python -m scripts.validate_workflow_integration staging_deploy

  report:
    name: Publish Precheck Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - precheck-production
      - precheck-staging
    steps:
      - name: Write summary
        run: |
          echo "## Deployment Secrets Precheck" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.precheck-production.outputs.state }}" = "PASS" ]; then
            echo "- Production: PASS" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.precheck-production.outputs.state }}" = "NOT_CONFIGURED" ]; then
            echo "- Production: NOT_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Production: FAIL (missing: ${{ needs.precheck-production.outputs.missing_csv }})" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ needs.precheck-staging.outputs.state }}" = "PASS" ]; then
            echo "- Staging: PASS" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ needs.precheck-staging.outputs.state }}" = "NOT_CONFIGURED" ]; then
            echo "- Staging: NOT_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Staging: FAIL (missing: ${{ needs.precheck-staging.outputs.missing_csv }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when any environment is missing required secrets
        if: >-
          (needs.precheck-production.outputs.state != 'PASS' &&
          needs.precheck-production.outputs.state != 'NOT_CONFIGURED') ||
          (needs.precheck-staging.outputs.state != 'PASS' &&
          needs.precheck-staging.outputs.state != 'NOT_CONFIGURED')
        run: |
          echo "One or more environments are missing required deployment secrets."
          exit 1
