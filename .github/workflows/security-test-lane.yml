name: Security Test Lane

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Nightly full-fidelity run — safety net behind the PR path filters.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for every job, including the `detect` classifier which
# reads the PR file list via the REST API.
permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yml

  security-backend-suite:
    name: security-backend-suite
    needs: detect
    if: >-
      needs.detect.outputs.run_heavy == 'true'
      && (needs.detect.outputs.security == 'true'
          || needs.detect.outputs.backend == 'true'
          || needs.detect.outputs.full_run == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-validation.txt ]; then pip install -r backend/requirements-validation.txt; fi

      - name: Run auth and token tests
        run: |
          python -m pytest -q \
            backend/tests/test_core_security.py \
            backend/tests/test_auth_cookie_csrf.py

      - name: Run session and CSRF hardening tests
        run: |
          python -m pytest -q \
            backend/tests/test_security_hardening.py

      - name: Run runtime security guardrail tests
        run: |
          python -m pytest -q \
            backend/tests/test_db_credentials_guardrail.py \
            backend/tests/test_sqlite_runtime_guardrail.py
