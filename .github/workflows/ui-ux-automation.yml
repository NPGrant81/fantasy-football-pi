name: UI UX Automation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Nightly full-fidelity run — safety net behind the PR path filters.
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  # write is needed to post the theme-guardrail PR comment.
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    uses: ./.github/workflows/detect-changes.yml

  ui-ux-automation:
    needs: detect
    if: >-
      needs.detect.outputs.run_heavy == 'true'
      && (needs.detect.outputs.ui == 'true'
          || needs.detect.outputs.frontend == 'true'
          || needs.detect.outputs.full_run == 'true')
    runs-on: ubuntu-24.04
    container: cypress/included@sha256:9f27bf8330595fe44dc3ba9c0c96cff1618d24241bd9f95a470f8f6e2ecfba7e
    defaults:
      run:
        shell: bash
    env:
      UI_HOST: 127.0.0.1
      UI_PORT_A11Y: 5173
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Test visual baseline comparator
        working-directory: frontend
        run: npm run test:visual

      - name: Lint UI components and pages
        working-directory: frontend
        run: |
          npx eslint src/components src/pages

      - name: Enforce light-first theme guardrails
        id: theme_guardrails
        continue-on-error: true
        working-directory: frontend
        run: |
          set +e
          npm run lint:theme 2>&1 | tee ../theme-lint.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment PR with theme guardrail failures
        if: github.event_name == 'pull_request' && steps.theme_guardrails.outputs.exit_code != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- theme-guardrails-report -->';
            const logPath = 'theme-lint.log';
            const fallback = 'Theme guardrails failed, but no lint log was captured.';
            let log = fallback;

            if (fs.existsSync(logPath)) {
              log = fs.readFileSync(logPath, 'utf8').trim() || fallback;
            }

            const maxLen = 50000;
            if (log.length > maxLen) {
              log = `${log.slice(0, maxLen)}\n\n...output truncated...`;
            }

            const body = `${marker}
            ## Theme Guardrails Failed

            The light-first theme guardrail check failed in CI.

            <details>
            <summary>Failure Output</summary>

            \`\`\`
            ${log}
            \`\`\`

            </details>

            Please convert dark-first classes to light-first with dark overrides.`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Upload theme guardrail log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: theme-guardrail-log
          if-no-files-found: ignore
          path: theme-lint.log

      - name: Fail when theme guardrails fail
        if: steps.theme_guardrails.outputs.exit_code != '0'
        run: |
          echo "Theme guardrails failed. See PR comment and artifact for details."
          exit 1

      - name: Start and verify UI server
        id: ui_server
        working-directory: frontend
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js --host "$UI_HOST" --port "$UI_PORT_A11Y" --strictPort > ../ui-server.log 2>&1 &
          SERVER_PID=$!
          echo "$SERVER_PID" > ../ui-server.pid
          for attempt in {1..60}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat ../ui-server.log
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -fsS -H 'Accept: text/html' "http://$UI_HOST:$UI_PORT_A11Y/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../ui-server.log
          echo "UI server did not become ready after 60 bounded attempts (each request capped at 5 seconds)."
          exit 1

      - name: Run accessibility smoke checks
        id: accessibility
        working-directory: frontend
        run: npx cypress run --browser chrome --spec cypress/e2e/accessibility_smoke.spec.js --config "baseUrl=http://$UI_HOST:$UI_PORT_A11Y"

      - name: Run screenshot capture for visual regression
        id: screenshots
        working-directory: frontend
        run: npx cypress run --browser chrome --spec cypress/e2e/uat_capture_pages.spec.js --config "baseUrl=http://$UI_HOST:$UI_PORT_A11Y"

      - name: Validate screenshot baseline stability
        id: visual_baseline
        working-directory: frontend
        run: |
          npm run visual:compare

      - name: Build frontend preview artifact
        id: preview_build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend preview artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-preview-dist
          path: frontend/dist

      - name: Upload UI screenshot artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-screenshots
          if-no-files-found: ignore
          path: frontend/cypress/screenshots

      - name: Upload visual diff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-visual-diffs
          if-no-files-found: ignore
          path: frontend/cypress/visual-diffs

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-ux-cypress-videos
          if-no-files-found: ignore
          path: frontend/cypress/videos

      - name: Stop UI server
        if: always()
        run: |
          if [ -f ui-server.pid ]; then
            kill "$(cat ui-server.pid)" 2>/dev/null || true
          fi

      - name: Upload UI startup logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-server-log
          if-no-files-found: ignore
          path: ui-server.log

      - name: Publish UI UX pipeline summary
        if: always()
        run: |
          {
            echo "## UI/UX Automation Summary"
            echo ""
            echo "- UI readiness: ${{ steps.ui_server.outcome }}"
            echo "- Accessibility smoke checks: ${{ steps.accessibility.outcome }}"
            echo "- Screenshot capture: ${{ steps.screenshots.outcome }}"
            echo "- Visual baseline validation: ${{ steps.visual_baseline.outcome }}"
            echo "- Preview build: ${{ steps.preview_build.outcome }}"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
