name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a new ref or rollback to a previous ref
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      release_ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: false
        default: main
        type: string
      rollback_ref:
        description: Optional rollback ref (falls back to last successful staging ref)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  validate-staging-env:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      state: ${{ steps.validate.outputs.state }}
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7

      - name: Validate staging deployment configuration
        id: validate
        env:
          STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED || 'false' }}
          STAGING_DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          STAGING_DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          STAGING_DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          STAGING_DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          STAGING_DEPLOY_KNOWN_HOST: ${{ secrets.STAGING_DEPLOY_KNOWN_HOST }}
        run: python -m scripts.validate_workflow_integration staging_deploy

      - name: Publish staging deployment intent
        if: always()
        run: |
          {
            echo "## Staging Deployment Request"
            echo ""
            echo "- State: ${{ steps.validate.outputs.state }}"
            echo "- Action: ${{ inputs.action }}"
            echo "- Release ref: ${{ inputs.release_ref }}"
            echo "- Rollback ref: ${{ inputs.rollback_ref || 'auto(last_success_staging.ref)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: validate-staging-env
    if: needs.validate-staging-env.outputs.state == 'PASS'
    environment: staging
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v7

      - name: Configure SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ed25519

      - name: Trust staging host
        env:
          DEPLOY_KNOWN_HOST: ${{ secrets.STAGING_DEPLOY_KNOWN_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Execute staging deploy or rollback
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.STAGING_DEPLOY_APP_DIR }}
          ACTION: ${{ inputs.action }}
          RELEASE_REF: ${{ inputs.release_ref }}
          ROLLBACK_REF: ${{ inputs.rollback_ref }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$DEPLOY_APP_DIR' ACTION='$ACTION' RELEASE_REF='$RELEASE_REF' ROLLBACK_REF='$ROLLBACK_REF' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$APP_DIR"
          mkdir -p .deploy

          git fetch --all --tags
          PREVIOUS_SUCCESS_REF=""
          if [ -f .deploy/current_staging.ref ]; then
            PREVIOUS_SUCCESS_REF=$(cat .deploy/current_staging.ref)
          fi

          if [ "$ACTION" = "deploy" ]; then
            TARGET_REF_RESOLVED=$(git rev-parse "$RELEASE_REF")
            git checkout --force "$TARGET_REF_RESOLVED"
          elif [ "$ACTION" = "rollback" ]; then
            if [ -n "$ROLLBACK_REF" ]; then
              TARGET_REF_RESOLVED=$(git rev-parse "$ROLLBACK_REF")
            elif [ -f .deploy/last_success_staging.ref ]; then
              TARGET_REF_RESOLVED=$(cat .deploy/last_success_staging.ref)
            else
              echo "No rollback reference found. Provide rollback_ref input."
              exit 1
            fi
            git checkout --force "$TARGET_REF_RESOLVED"
          else
            echo "Unsupported action: $ACTION"
            exit 1
          fi

          cd backend
          if [ ! -x ./venv/bin/python ]; then
            python3 -m venv venv
          fi
          ./venv/bin/pip install -r requirements-lock.txt

          cd ../frontend
          npm ci --legacy-peer-deps
          npm run build

          sudo mkdir -p /var/www/fantasy-football-pi/frontend
          sudo rsync -av --delete dist/ /var/www/fantasy-football-pi/frontend/dist/

          sudo systemctl restart fantasy-football-backend
          sudo systemctl reload nginx

          cd ..
          ./backend/venv/bin/python - <<'HEALTH_CHECK'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          for attempt in range(30):
              try:
                  with urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      payload = json.load(response)
                  if (
                      payload.get("status") == "ok"
                      and payload.get("database") == "ok"
                      and payload.get("schema") == "ok"
                  ):
                      print("Deployment health verified.")
                      break
              except (URLError, TimeoutError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Deployment health verification failed; success metadata was not advanced.")
          HEALTH_CHECK
          if [ -n "$PREVIOUS_SUCCESS_REF" ]; then
            printf '%s\n' "$PREVIOUS_SUCCESS_REF" > .deploy/last_success_staging.ref
          fi
          echo "$TARGET_REF_RESOLVED" > .deploy/current_staging.ref
          echo "DEPLOYED_REF=$TARGET_REF_RESOLVED"
          REMOTE_SCRIPT

      - name: Publish staging deployment summary
        if: always()
        run: |
          {
            echo "## Staging Deployment Result"
            echo ""
            echo "- Outcome: ${{ job.status }}"
            echo "- Action: ${{ inputs.action }}"
            echo "- Requested release ref: ${{ inputs.release_ref }}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping Slack notification."
            exit 0
          fi
          payload=$(cat <<EOF
          {
            "text": "Staging deployment ${{ job.status }} for ${{ github.repository }}. Action=${{ inputs.action }}, ref=${{ inputs.release_ref }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Notify Teams
        if: always()
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_WEBHOOK_URL" ]; then
            echo "TEAMS_WEBHOOK_URL not configured; skipping Teams notification."
            exit 0
          fi
          payload=$(cat <<EOF
          {
            "text": "Staging deployment ${{ job.status }} for ${{ github.repository }}. Action=${{ inputs.action }}, ref=${{ inputs.release_ref }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$TEAMS_WEBHOOK_URL"
