# Cloudflare Tunnel config template for Fantasy Football Pi
# Tunnel name: ppl-insight-hub-prod1
# Domain: pplinsighthub.com
#
# The tunnel origin is the dedicated loopback-only Nginx listener on port 8080.
# Install deploy/nginx/fantasy-football-pi-tunnel-origin.conf.example for this
# origin mode. Do not point this tunnel at the redirecting TLS example on :80.
# If cloudflared runs on another host, deliberately configure and validate a
# private origin route rather than exposing the loopback-only listener.
# cloudflared ingress rules do not provide origin health probes. Validate the
# origin locally and use the systemd watchdog or an external monitor for probes.

tunnel: ppl-insight-hub-prod1
credentials-file: /etc/cloudflared/<tunnel-uuid>.json

ingress:
  - hostname: pplinsighthub.com
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 5s
      noHappyEyeballs: true
  - hostname: www.pplinsighthub.com
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 5s
      noHappyEyeballs: true
  - service: http_status:404
